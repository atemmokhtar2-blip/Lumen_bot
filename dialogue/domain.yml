version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - ask_help
  - ask_capabilities
  - ask_plan
  - ask_pricing
  - ask_how_to_generate
  - describe_bot_idea
  - ask_limitations
  - ask_support
  - how_platform_works
  - how_to_upgrade
  - ask_about_hosting
  - ask_about_preview
  - ask_about_watermark
  - ask_about_free
  - ask_about_starter
  - ask_about_growth
  - out_of_scope
  - project_identity
  - project_capabilities
  - project_workflow
  - ask_current_plan
  - ask_plan_details
  - ask_plan_comparison
  - ask_plan_limits
  - ask_hosting
  - ask_preview
  - ask_generation
  - ask_billing_support
  - ask_project_component

entities:
  - bot_type
  - plan_name

slots:
  plan_id:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  last_bot_idea:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: |
        مرحباً بك في Maestro 👋
        أنا هنا لمساعدتك في بناء وإدارة مشاريع البوتات بكل سهولة وذكاء.
        اسألني عن طريقة العمل، الخطط، الترقية، أو اكتب وصف بوت.

  utter_goodbye:
    - text: إلى اللقاء! اكتب /start أو أي سؤال لما ترجع.

  utter_iamabot:
    - text: أنا مساعد Maestro — نموذج حوار مدرَّب (Rasa) على فهم المنصة.

  utter_help:
    - text: |
        أقدر أساعدك في: طريقة عمل المنصة، الخطط والترقية، الاستضافة، المعاينة، ووصف البوت للتوليد.
        أوامر: /plan · /help · /start

  utter_capabilities:
    - text: |
        ⚙️ *إزاي Maestro بيشتغل؟*
        
        1) *الشات الذكي*: بتفهم قصدك (سؤال عن الخطط، الترقية، أو وصف بوت).
        2) *التوليد*: لما تكتب وصف بوت واضح، محرك التوليد يبني مشروع تيليجرام حسب *خطتك*.
        3) *المعاينة الحية*: تجربة تشغيل مؤقتة بعد التوليد (مدتها حسب الخطة).
        4) *الاستضافة 24/7*: للخطط المدفوعة فقط (Starter/Growth) في بيئة معزولة.
        5) *الحدود*: التوليد والاستضافة والصلاحيات تتفرض من السيرفر حسب الاشتراك — مش من كلام المستخدم.
        
        أوامر مفيدة: /start · /plan · /help

  utter_how_platform_works:
    - text: |
        ⚙️ *إزاي Maestro بيشتغل؟*
        
        1) *الشات الذكي*: بتفهم قصدك (سؤال عن الخطط، الترقية، أو وصف بوت).
        2) *التوليد*: لما تكتب وصف بوت واضح، محرك التوليد يبني مشروع تيليجرام حسب *خطتك*.
        3) *المعاينة الحية*: تجربة تشغيل مؤقتة بعد التوليد (مدتها حسب الخطة).
        4) *الاستضافة 24/7*: للخطط المدفوعة فقط (Starter/Growth) في بيئة معزولة.
        5) *الحدود*: التوليد والاستضافة والصلاحيات تتفرض من السيرفر حسب الاشتراك — مش من كلام المستخدم.
        
        أوامر مفيدة: /start · /plan · /help

  utter_how_to_upgrade:
    - text: |
        🚀 *إزاي ترقّي خطتك؟*
        
        الخطط:
        • *Free* — مجاني
        • *Starter (المبادر)* — $8/شهر أو $144/سنة
        • *Growth (النمو / Pro)* — $30/شهر أو $390/سنة
        
        الترقية:
        1) اكتب /plan لمعرفة خطتك الحالية.
        2) للترقية المدفوعة تواصل مع الدعم أو مسار الدفع في المنصة:
           capability7maestro7bot@gmail.com
        3) بعد تأكيد الدفع تتحدث خطتك تلقائياً على الحساب (Mongo) وتتفتح الصلاحيات فوراً.
        
        ملاحظة: مفيش ترقية «يدوي من الشات» من غير تحقق دفع — الأمان أولاً.

  utter_plan_info:
    - text: |
        اكتب /plan لعرض خطتك الحالية.
        أو اسأل عن تفاصيل Free / Starter / Growth.

  utter_pricing:
    - text: |
        📦 *خطة Free (مجاني)*
        • توليد: 25/شهر
        • استضافة 24/7: غير متاحة
        • معاينة حية: 30 دقيقة بعد التوليد ثم تتوقف
        • المحرك: basic (أوامر، أزرار، ردود تلقائية)
        • علامة مائية على البوتات: ⚡ Powered by Maestro
        • رسائل تقريبية: حتى 2000/شهر
        
        📦 *خطة Starter — المبادر ($8/شهر | $144/سنة)*
        • توليد: 50/شهر
        • استضافة 24/7: بوت واحد في حاوية معزولة
        • مدفوعات Stripe + Webhooks / APIs خارجية
        • رسائل: حتى 10,000/شهر
        • معاينة أطول من Free
        • دعم: capability7maestro7bot@gmail.com
        
        📦 *خطة Growth — النمو / Pro ($30/شهر | $390/سنة)*
        • توليد: 300/شهر
        • استضافة 24/7: حتى 5 بوتات
        • قواعد بيانات (SQLite/PostgreSQL) + تحليلات
        • رسائل: حتى 100,000/شهر
        • محرك advanced + أولوية دعم
        • دعم: capability7maestro7bot@gmail.com

  utter_ask_about_free:
    - text: |
        📦 *خطة Free (مجاني)*
        • توليد: 25/شهر
        • استضافة 24/7: غير متاحة
        • معاينة حية: 30 دقيقة بعد التوليد ثم تتوقف
        • المحرك: basic (أوامر، أزرار، ردود تلقائية)
        • علامة مائية على البوتات: ⚡ Powered by Maestro
        • رسائل تقريبية: حتى 2000/شهر

  utter_ask_about_starter:
    - text: |
        📦 *خطة Starter — المبادر ($8/شهر | $144/سنة)*
        • توليد: 50/شهر
        • استضافة 24/7: بوت واحد في حاوية معزولة
        • مدفوعات Stripe + Webhooks / APIs خارجية
        • رسائل: حتى 10,000/شهر
        • معاينة أطول من Free
        • دعم: capability7maestro7bot@gmail.com

  utter_ask_about_growth:
    - text: |
        📦 *خطة Growth — النمو / Pro ($30/شهر | $390/سنة)*
        • توليد: 300/شهر
        • استضافة 24/7: حتى 5 بوتات
        • قواعد بيانات (SQLite/PostgreSQL) + تحليلات
        • رسائل: حتى 100,000/شهر
        • محرك advanced + أولوية دعم
        • دعم: capability7maestro7bot@gmail.com

  utter_hosting:
    - text: |
        🖥️ *الاستضافة*
        • Free: لا استضافة دائمة — معاينة حية 30 دقيقة فقط.
        • Starter: بوت واحد شغال 24/7.
        • Growth: حتى 5 بوتات 24/7.
        التشغيل يتم في عزل (Docker عند التوفر) لحماية السيرفر والمستخدمين.

  utter_preview:
    - text: |
        ⏱️ *المعاينة الحية (Live Preview)*
        بعد التوليد تقدر تجرب البوت لمدة محدودة:
        • Free: 30 دقيقة
        • Starter: حوالي 60 دقيقة
        • Growth: حتى 120 دقيقة
        بعدها يتوقف التشغيل ما لم تكن على خطة فيها استضافة 24/7.

  utter_watermark:
    - text: |
        🏷️ *العلامة المائية*
        على خطة Free كل بوت مولَّد يحمل: ⚡ Powered by Maestro
        الخطط المدفوعة (Starter/Growth) بدون العلامة دي.

  utter_how_to_generate:
    - text: |
        🛠️ *مسار عمل بوت من الصفر*
        1) اكتب وصف واضح: الجمهور + الأوامر/الأزرار + سيناريو.
        2) المنصة تفحص خطتك والحد الشهري.
        3) يتولد المشروع (ملفات جاهزة / zip).
        4) معاينة حية حسب الخطة.
        5) استضافة دائمة إن كانت خطتك تسمح.
        كل ما الوصف أدق، النتيجة أقوى.

  utter_ask_clarify_idea:
    - text: |
        تمام — وضّح الجمهور والأوامر وهل فيه دفع/أدمن، ثم اكتب الوصف للتوليد.

  utter_limitations:
    - text: |
        ⚠️ *حدود مهمة*
        • التوليد له سقف شهري حسب الخطة.
        • الاستضافة والصلاحيات المتقدمة مش على Free.
        • النظام يرفض تجاوز الحصص من السيرفر (ما ينفعش التحايل من الشات).
        • للدعم المدفوع: capability7maestro7bot@gmail.com

  utter_support:
    - text: |
        الدعم: capability7maestro7bot@gmail.com
        اكتب سؤالك عن الترقية أو الاستضافة.

  utter_out_of_scope:
    - text: الطلب برا نطاق Maestro. اسأل عن الخطط أو توليد بوتات تيليجرام.

  utter_affirm:
    - text: تمام، كمّل سؤالك أو اكتب وصف البوت.

  utter_deny:
    - text: حاضر. ابدأ من /start لو حابب.

  utter_default:
    - text: |
        مش واصلني المعنى بوضوح. صِغ السؤال تاني أو اسأل عن طريقة العمل / الترقية / الخطط.

actions:
  - action_default_fallback
  - action_session_start
  - action_report_plan
  - action_note_bot_idea

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
