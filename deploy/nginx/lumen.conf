# Lumen Phase 3 — path-based public hosting (option A)
# server_name host.lumen.example;
# map $slug → upstream via control plane generated includes.

upstream lumen_placeholder {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name host.lumen.example;

    location ~ ^/p/(?<slug>[a-z0-9\-]+)/(.*)$ {
        proxy_pass http://lumen_placeholder/$2$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Lumen-Slug $slug;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
