# World-class DAST: live API + authenticated IDOR + ZAP baseline + ZAP OpenAPI scan
name: DAST ZAP

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-zap-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  TBE_ENV: test
  TBE_MULTI_TENANT: "0"
  TBE_REQUIRE_DOCKER: "0"
  TBE_ALLOW_LOCAL_PROCESS: "1"
  PLATFORM_ADMIN_TOKEN: dast-live-admin-token-32chars-xx
  STRIPE_WEBHOOK_SECRET: whsec_dast_live_secret
  ALLOW_DEV_BILLING: "0"
  API_HOST: 127.0.0.1
  API_PORT: "8765"
  DAST_BASE_URL: http://127.0.0.1:8765

jobs:
  unit-idor:
    name: IDOR unit matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -U pip pytest
          pip install -r requirements.txt
      - run: |
          pytest tests/test_security_idor_dast.py -q --tb=short
          python scripts/security/dast_api_probe.py

  live-idor-and-zap:
    name: Live API + IDOR HTTP + ZAP baseline + ZAP API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Start live API
        env:
          OUTPUT_DIR: ${{ runner.temp }}/dast-api-out
        run: |
          mkdir -p "$OUTPUT_DIR"
          nohup python scripts/security/start_api_dast.py >"$OUTPUT_DIR/api.log" 2>&1 &
          echo $! >"$OUTPUT_DIR/api.pid"
          for i in $(seq 1 45); do
            curl -sf "$DAST_BASE_URL/health" && echo ready && exit 0
            sleep 1
          done
          tail -100 "$OUTPUT_DIR/api.log" || true
          exit 1
      - name: Seed two tenants (admin API)
        env:
          DAST_SEED_FILE: ${{ runner.temp }}/dast-tenants.json
        run: python scripts/security/seed_dast_tenants.py
      - name: Live authenticated IDOR over HTTP
        env:
          DAST_SEED_FILE: ${{ runner.temp }}/dast-tenants.json
        run: python scripts/security/live_idor_http.py
      - name: OWASP ZAP baseline (spider + passive/active light)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8765"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -J zap-baseline-report.json"
          fail_action: true
          allow_issue_writing: false
      - name: OWASP ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "http://127.0.0.1:8765/openapi.yaml"
          format: openapi
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -J zap-api-report.json"
          fail_action: true
          allow_issue_writing: false
      - name: Parse ZAP reports — fail MEDIUM+
        if: always()
        run: |
          set -e
          found=0
          for f in zap-baseline-report.json zap-api-report.json; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              python scripts/security/zap_fail_on_severity.py "$f" || found=1
            fi
          done
          # Also search workspace for ZAP outputs
          find . -name 'zap*.json' -o -name 'report_json.json' 2>/dev/null | head -20 || true
          exit $found
        continue-on-error: true
      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-baseline-report.json
            zap-api-report.json
            ${{ runner.temp }}/dast-tenants.json
            ${{ runner.temp }}/dast-api-out/api.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop API
        if: always()
        run: |
          kill "$(cat "${{ runner.temp }}/dast-api-out/api.pid")" 2>/dev/null || true
