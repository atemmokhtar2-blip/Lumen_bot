# Phase 3 — hardened supply chain (official engines only)
# Engines: GitHub Dependency Review, Google OSV-Scanner, Anchore Syft/Grype,
#          Aqua Trivy (image + secrets), Sigstore Cosign, GitHub Artifact Attestation
name: Supply Chain

on:
  push:
    branches: [Lumen, main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: lumen-supply
  IMAGE_TAG: phase3-${{ github.sha }}

jobs:
  dependency-review:
    name: GitHub Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review (official GitHub)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          warn-on-openssf-scorecard-level: 5
        continue-on-error: true

  osv-scanner:
    name: Google OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (official Google container)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src:ro" \
            ghcr.io/google/osv-scanner:latest \
            scan source --recursive /src

  syft-sbom:
    name: Syft SBOM (Anchore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Require non-empty SBOMs
        run: |
          test -s sbom.spdx.json
          test -s sbom.cdx.json
          wc -c sbom.spdx.json sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90

  grype:
    name: Grype (Anchore) fail on HIGH+
    runs-on: ubuntu-latest
    needs: [syft-sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Grype directory scan
        uses: anchore/scan-action@v6
        id: grype
        with:
          path: "."
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: Print Grype vulnerability details
        if: always()
        run: grype dir:. -o table
        continue-on-error: true
      - name: Preserve Grype SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-sarif
          path: ${{ steps.grype.outputs.sarif }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
        continue-on-error: true

  trivy-secrets:
    name: Trivy secret scan (Aqua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy filesystem secrets
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
          format: table

  build-sign-scan:
    name: Build image + Trivy + Cosign + Attest
    runs-on: ubuntu-latest
    needs: [grype, trivy-secrets]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image (hardened Dockerfile)
        id: build-image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # Gate on HIGH/CRITICAL only. Trivy Action clears TRIVY_SEVERITY when
      # producing unrestricted SARIF, so a SARIF gate was incorrectly failing
      # on MEDIUM/LOW findings despite this workflow's HIGH/CRITICAL threshold.
      - name: Hardened runtime smoke test (Python 3.12 + privilege boundary)
        run: |
          docker run --rm --entrypoint /usr/local/bin/python3.12 \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -c '
          import os, sys, importlib.util
          assert os.getuid() == 65532, f"unexpected runtime uid: {os.getuid()}"
          assert sys.version_info[:2] == (3, 12), f"unexpected Python: {sys.version}"
          assert importlib.util.find_spec("pip") is None, "pip must not ship in runtime"
          with open("/proc/self/status", encoding="ascii") as status_file:
              cap_eff = next(line.split()[1] for line in status_file if line.startswith("CapEff:"))
          assert int(cap_eff, 16) == 0, f"runtime process has effective capabilities: {cap_eff}"
          import aiohttp, argon2, cryptography, curl_cffi, grpc, onnxruntime
          import PIL, playwright, psycopg, pymongo, redis, sqlite_vec, telegram
          import temporalio, tree_sitter
          print("Hardened Python 3.12 runtime imports OK; uid=65532; CapEff=0")
          '

      - name: Trivy image CVE gate (CRITICAL/HIGH fail)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          format: table

      # Keep every severity in Code Scanning, but do not use this report as
      # the admission decision. The gate above owns the HIGH/CRITICAL policy.
      - name: Trivy image full SARIF report (all severities)
        if: always() && steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          trivyignores: .trivyignore
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          format: sarif
          output: trivy-image.sarif

      - name: Trivy image secrets
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: secret
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
          format: table

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true

      - name: Install Cosign (Sigstore official)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Cosign keyless sign Docker archive (OIDC)
        if: github.event_name != 'pull_request'
        id: cosign
        run: |
          # Sign the exact image archive; never treat a local Docker RepoDigest as a registry digest.
          docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -o image.tar
          IMAGE_DIGEST="$(sha256sum image.tar | awk '{print $1}')"
          printf '%s\n' "$IMAGE_DIGEST" > image.sha256
          echo "digest=sha256:$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          cosign sign-blob --yes --bundle cosign-bundle.json image.tar
          cosign verify-blob --bundle cosign-bundle.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@refs/heads/Lumen" \
            image.tar
          rm -f image.tar

      - name: Attest build provenance (GitHub official)
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: lumen-supply-docker-archive
          subject-digest: ${{ steps.cosign.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-artifacts
          path: |
            trivy-image.sarif
            cosign-bundle.json
            image.sha256
          if-no-files-found: ignore
          retention-days: 30

  admission-gate:
    name: Phase-3 admission gate
    runs-on: ubuntu-latest
    needs: [osv-scanner, grype, trivy-secrets, build-sign-scan, syft-sbom]
    if: always()
    steps:
      - name: All required engines must succeed
        run: |
          echo "osv=${{ needs.osv-scanner.result }}"
          echo "grype=${{ needs.grype.result }}"
          echo "secrets=${{ needs.trivy-secrets.result }}"
          echo "build=${{ needs.build-sign-scan.result }}"
          echo "sbom=${{ needs.syft-sbom.result }}"
          for r in "${{ needs.osv-scanner.result }}" "${{ needs.grype.result }}" \
                    "${{ needs.trivy-secrets.result }}" "${{ needs.build-sign-scan.result }}" \
                    "${{ needs.syft-sbom.result }}"; do
            if [ "$r" != "success" ]; then
              echo "ADMISSION DENIED: $r"
              exit 1
            fi
          done
          echo "ADMISSION OK"
