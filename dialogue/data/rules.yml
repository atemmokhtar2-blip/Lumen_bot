version: "3.1"
rules:
- rule: greet always
  steps:
  - intent: greet
  - action: utter_greet

- rule: goodbye always
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: fallback
  steps:
  - intent: nlu_fallback
  - action: action_default_fallback

- rule: help always
  steps:
  - intent: ask_help
  - action: utter_help

- rule: plan always
  steps:
  - intent: ask_plan
  - action: action_report_plan

- rule: session start
  conversation_start: true
  steps:
  - action: action_session_start

- rule: platform works
  steps:
  - intent: how_platform_works
  - action: utter_how_platform_works

- rule: upgrade path
  steps:
  - intent: how_to_upgrade
  - action: utter_how_to_upgrade

- rule: hosting info
  steps:
  - intent: ask_about_hosting
  - action: utter_hosting

- rule: preview info
  steps:
  - intent: ask_about_preview
  - action: utter_preview

- rule: watermark info
  steps:
  - intent: ask_about_watermark
  - action: utter_watermark
