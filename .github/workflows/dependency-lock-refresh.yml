name: Dependency Lock Refresh

on:
  pull_request:
  push:
    branches: [Lumen]
    paths:
      - ".github/workflows/dependency-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile lock with patched dependency floors
        run: |
          python -m pip install --upgrade pip==25.3 pip-tools==7.5.2 pip-audit
          pip-compile --resolver=backtracking \
            --upgrade-package aiohttp \
            --upgrade-package pymongo \
            --upgrade-package opentelemetry-api \
            --upgrade-package opentelemetry-sdk \
            --upgrade-package opentelemetry-exporter-otlp-proto-http \
            --upgrade-package langgraph \
            --upgrade-package langgraph-checkpoint-sqlite \
            --upgrade-package certifi \
            --upgrade-package multidict \
            --upgrade-package dnspython \
            --upgrade-package urllib3 \
            --upgrade-package mcp \
            --upgrade-package temporalio \
            --upgrade-package mako \
            --output-file=requirements.lock requirements.txt
          pip-audit -r requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refreshed-requirements-lock
          path: requirements.lock
          retention-days: 7
