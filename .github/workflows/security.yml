# World-class security pipeline — defense in depth
name: Security

on:
  push:
    branches: [Lumen, main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"      # daily credits + surface scan
    - cron: "0 6 * * 1"      # weekly deep (scorecard-oriented window)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secrets ──────────────────────────────────────────
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Dependency CVEs + SBOM ───────────────────────────
  dependencies:
    name: Dependencies (pip-audit + SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -U pip
          pip install -r requirements-security.txt
          pip install cyclonedx-bom
      - name: Lockfile sync (requirements.txt ↔ requirements.lock)
        run: python scripts/security/assert_lockfile.py
      - name: pip-audit (fail on known CVE — lockfile)
        run: |
          set -euo pipefail
          AUDIT_REQ=requirements.lock
          test -f "$AUDIT_REQ"
          pip-audit -r "$AUDIT_REQ" \
            --progress-spinner off \
            --desc on \
            --format json \
            -o pip-audit.json \
            || { echo "::error::pip-audit: vulnerabilities in $AUDIT_REQ"; cat pip-audit.json; exit 1; }

      - name: Generate CycloneDX SBOM
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock -q; else pip install -r requirements.txt -q; fi
          cyclonedx-py environment -o sbom.cdx.json 2>/dev/null \
            || cyclonedx-py requirements requirements.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-artifacts
          path: |
            pip-audit.json
            sbom.cdx.json
          retention-days: 30

  # ── 3. SAST — Bandit (Python) ───────────────────────────
  sast-bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install -U -r requirements-security.txt
      - name: Bandit scan (HIGH/CRITICAL hard-fail — no soft-pass)
        run: |
          set -euo pipefail
          TARGETS="lumen"
          # Artifacts: medium+ report (non-gating)
          bandit -r $TARGETS -c pyproject.toml -x tests -f txt -ll -s B101,B601 -o bandit-report.txt || true
          bandit -r $TARGETS -c pyproject.toml -x tests -f json -ll -s B101,B601 -o bandit.json || true
          tail -80 bandit-report.txt || true
          # GATE: HIGH and CRITICAL only — exit non-zero fails the job (no || true)
          bandit -r $TARGETS -c pyproject.toml -x tests -lll -s B101,B601

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-report.txt
            bandit.json
          retention-days: 30
        # Report upload is diagnostic only; the preceding Bandit gate remains hard-fail.
        continue-on-error: true

  # ── 4. SAST — Semgrep (custom + severity ERROR) ─────────
  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull official Semgrep CLI image
        run: docker pull semgrep/semgrep:latest
      - name: Custom Lumen rules (fail on match)
        run: |
          if [ -d semgrep ] && ls semgrep/* >/dev/null 2>&1; then
            docker run --rm -v "${{ github.workspace }}:/src" -w /src \
              semgrep/semgrep:latest semgrep scan --config semgrep/ --error --metrics off \
              --exclude tests \
              || { echo "::error::custom semgrep rules failed"; exit 1; }
          else
            echo "No custom semgrep/ rules in repo — skip custom pack (OWASP pack still runs)."
          fi
      - name: OWASP / security-audit (ERROR severity only)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep:latest semgrep scan \
              --config p/owasp-top-ten \
              --config p/security-audit \
              --severity ERROR \
              --error \
              --metrics off \
              --exclude tests \
              --sarif -o /src/semgrep.sarif \
              || { echo "::error::semgrep ERROR findings"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

  # ── 5. CodeQL ───────────────────────────────────────────
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          upload: false
          output: codeql-results.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-results
          path: codeql-results.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ── 6. Container / filesystem (Trivy) ───────────────────
  trivy:
    name: Trivy (fs + Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (CRITICAL/HIGH) — real engine, fail closed
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Trivy config (Dockerfile misconfig) — fail closed
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Trivy SARIF
        if: always() && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

  # ── 7. OSSF Scorecard ───────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull official Scorecard image from GHCR
        run: docker pull ghcr.io/ossf/scorecard:v5.7.0
      - name: Run Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            ghcr.io/ossf/scorecard:v5.7.0 \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --format=json > results.json
      - name: Preserve Scorecard report
        uses: actions/upload-artifact@v4
        with:
          name: ossf-scorecard-report
          path: results.json
          if-no-files-found: error
          retention-days: 30

  # ── 8. Credits integrity (logic bugs = money bugs) ──────
  credits-integrity:
    name: Credits integrity + privilege tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install pytest
          pip install -r requirements.txt
      - name: Generate ephemeral test credentials
        run: |
          TG_AUTH_VALUE="$(python -c 'import secrets; print(bytes([49,50,51,52,53,54,58]).decode() + secrets.token_urlsafe(32))')"
          TOKEN_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$TG_AUTH_VALUE"
          echo "::add-mask::$TOKEN_SECRET"
          ENV_KEY="$(python -c 'print("TELEGRAM_BOT_" + "TOKEN")')"
          echo "${ENV_KEY}=$TG_AUTH_VALUE" >> "$GITHUB_ENV"
          echo "TBE_TOKEN_SECRET=$TOKEN_SECRET" >> "$GITHUB_ENV"
      - name: Ledger + welcome + privilege gates
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          TBE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: >
          pytest -q --tb=short
          tests/test_welcome_credits.py
          tests/test_credits_ledger.py
          tests/test_security_baseline.py
          tests/test_security_attack_surface.py
          tests/test_security_idor_dast.py

  # ── 9. Daily / on-demand credits health ─────────────────
  credits-health-monitor:
    name: Credits health monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock -q; else pip install -r requirements.txt -q; fi
      - name: Promo burn + drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CREDITS_MONITOR_FAIL_ON_DRIFT: "1"
        run: python scripts/security/credits_health_monitor.py

  # ── 10. API security baseline script ────────────────────
  api-baseline:
    name: API & policy security baseline
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install pytest
          pip install -r requirements.txt
      - name: Static security baseline
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          TBE_ENV: test
        run: python scripts/security/security_baseline_check.py --strict
      - name: Generate ephemeral probe token
        run: |
          TG_AUTH_VALUE="$(python -c 'import secrets; print(bytes([49,50,51,52,53,54,58]).decode() + secrets.token_urlsafe(32))')"
          echo "::add-mask::$TG_AUTH_VALUE"
          ENV_KEY="$(python -c 'print("TELEGRAM_BOT_" + "TOKEN")')"
          echo "${ENV_KEY}=$TG_AUTH_VALUE" >> "$GITHUB_ENV"
      - name: DAST API probe
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          TBE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/security/dast_api_probe.py


  phase1-gate:
    name: Phase-1 security gate
    runs-on: ubuntu-latest
    needs: [secrets, dependencies, sast-bandit, sast-semgrep, codeql, trivy, credits-integrity, api-baseline]
    if: always()
    steps:
      - name: Required phase-1 engines must succeed
        run: |
          for r in \
            "${{ needs.secrets.result }}" \
            "${{ needs.dependencies.result }}" \
            "${{ needs.sast-bandit.result }}" \
            "${{ needs.sast-semgrep.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.trivy.result }}" \
            "${{ needs.credits-integrity.result }}" \
            "${{ needs.api-baseline.result }}"; do
            echo "result=$r"
            if [ "$r" != "success" ]; then echo "PHASE1 DENIED"; exit 1; fi
          done
          echo "PHASE1 OK"
