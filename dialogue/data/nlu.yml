version: "3.1"
nlu:
- intent: project_identity
  examples: |
    - إيه هو Maestro؟
    - ما هو المشروع ده؟
    - عرفني بنفسك
    - المشروع بتاعكم بيعمل إيه؟
    - أنت تابع لمين؟
    - إيه فكرة المنصة؟
    - هو ده بوت ولا منصة؟
    - ممكن تشرح لي Maestro؟
    - what is Maestro?
    - what is this project?
    - tell me about yourself
    - ما هو مشروع Maestro بالتحديد؟
    - إيه الهدف الأساسي من المشروع؟

- intent: project_capabilities
  examples: |
    - تقدر تعمل إيه؟
