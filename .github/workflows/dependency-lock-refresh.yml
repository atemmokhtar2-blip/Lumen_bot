name: Dependency lock refresh (temporary)

on:
  push:
    branches: [fix/ci-security-failures]
    paths:
      - requirements.txt
  pull_request:
    branches: [Lumen]
    paths:
      - requirements.txt

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools
      - name: Resolve only security-related upgrades
        run: |
          # Keep every existing lock pin unless a new direct security pin
          # or its dependency constraints require a change.
          pip-compile --resolver=backtracking --output-file=requirements.lock requirements.txt
      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "security(deps): refresh complete Python lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-requirements-lock
          path: requirements.lock
          retention-days: 2
