# Local stand-in for managed Postgres + private registry.
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tbe
      # Required external secret; no literal/default credential is committed.
      # kics-scan ignore-line
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: tbe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tbe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbe -d tbe"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Drop capabilities not needed by PostgreSQL while retaining its normal startup capabilities.
    cap_drop: [NET_RAW, SYS_CHROOT, MKNOD, AUDIT_WRITE]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - tbe_registry:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
volumes:
  tbe_pg:
  tbe_registry:
