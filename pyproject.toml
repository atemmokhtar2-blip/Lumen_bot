[project]
name = "lumen"
version = "1.0.0"
description = "Lumen — Telegram bot generation & B2B API platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.bandit]
exclude_dirs = ["tests", ".git", "data"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
  "integration: optional tests that may need containers or external services",
]
