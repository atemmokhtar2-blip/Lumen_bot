name: Refresh Temporal security lock

on:
  push:
    branches:
      - fix/post-merge-security
    paths:
      - requirements.txt
      - .github/workflows/refresh-temporal-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-temporal-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the updated Temporal dependency chain
        run: |
          python -m pip install --upgrade pip==25.3 pip-tools==7.5.2
          pip-compile --resolver=backtracking --allow-unsafe \
            --upgrade-package temporalio \
            --output-file=requirements.lock requirements.txt
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(lock): refresh Temporal SDK security dependencies [lock-refresh]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
