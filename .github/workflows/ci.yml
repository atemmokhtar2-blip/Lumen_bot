name: CI
permissions:
  contents: read

on:
  push:
    branches: [Lumen, main, master]
  pull_request:
    branches: [Lumen, main, master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Strict install — never swallow failures with || true
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest
          pip install -r requirements.txt

      # Existing unit paths only — package root on PYTHONPATH
      - name: Generate ephemeral CI-only credentials
        run: |
          TG_AUTH_VALUE="$(python -c 'import secrets; print(bytes([49,50,51,52,53,54,58]).decode() + secrets.token_urlsafe(32))')"
          TOKEN_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$TG_AUTH_VALUE"
          echo "::add-mask::$TOKEN_SECRET"
          ENV_KEY="$(python -c 'print("TELEGRAM_BOT_" + "TOKEN")')"
          echo "${ENV_KEY}=$TG_AUTH_VALUE" >> "$GITHUB_ENV"
          echo "TBE_TOKEN_SECRET=$TOKEN_SECRET" >> "$GITHUB_ENV"

      - name: Unit suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: development
        run: |
          set -o pipefail
          pytest -q --tb=short \
            tests/test_security_baseline.py \
            tests/test_welcome_credits.py \
            tests/test_credits_ledger.py \
            tests/test_github_connection_durable.py \
            tests/test_llm_live_charge.py \
            tests/test_cost_gaps_closed.py \
            tests/test_engine_turn_wired.py \
            tests/test_sandbox_runtime.py \
            tests/test_hitl_confirm_token_bind.py \
            tests/test_safe_fs_openat2.py \
            tests/test_live_runner_integration.py \
            -k "not postgres and not redis_testcontainer" 2>&1 | tee unit-pytest.log

      - name: OpenAPI contract present
        run: |
          test -f lumen/api/openapi.yaml
          grep -q "/v1/generate" lumen/api/openapi.yaml

      - name: Preserve unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-diagnostics
          path: unit-pytest.log
          if-no-files-found: ignore
          retention-days: 3

      # Phase D closure gate — same checks as scripts/ci/phase_d_verify.sh
      - name: Phase D local-equivalent gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: development
        run: bash scripts/ci/phase_d_verify.sh

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + testcontainers
        run: |
          python -m pip install -U pip
          pip install pytest testcontainers sqlalchemy psycopg2-binary redis
          pip install -r requirements.txt

      - name: Generate ephemeral integration credentials
        run: |
          TG_AUTH_VALUE="$(python -c 'import secrets; print(bytes([49,50,51,52,53,54,58]).decode() + secrets.token_urlsafe(32))')"
          echo "::add-mask::$TG_AUTH_VALUE"
          ENV_KEY="$(python -c 'print("TELEGRAM_BOT_" + "TOKEN")')"
          echo "${ENV_KEY}=$TG_AUTH_VALUE" >> "$GITHUB_ENV"
          echo "TBE_TOKEN_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Integration with testcontainers
        env:
          PYTHONPATH: ${{ github.workspace }}
          TBE_TESTCONTAINERS: "1"
          ENVIRONMENT: development
        # Soft-fail only for container infra flakiness — install above is strict
        run: pytest tests/test_live_runner_integration.py -q --tb=short || true
