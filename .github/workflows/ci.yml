name: CI
on:
  push:
    branches: [Lumen, main, master]
  pull_request:
    branches: [Lumen, main, master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Strict install — never swallow failures with || true
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest
          pip install -r requirements.txt

      # Existing unit paths only — package root on PYTHONPATH
      - name: Unit suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: "1:ci-placeholder"
          ENVIRONMENT: development
          TBE_TOKEN_SECRET: "unit-test-secret-key-32b-ci-only!!"
        run: >
          pytest -q --tb=short
          tests/test_security_baseline.py
          tests/test_welcome_credits.py
          tests/test_credits_ledger.py
          tests/test_github_connection_durable.py
          tests/test_live_runner_integration.py
          -k "not postgres and not redis_testcontainer"

      - name: OpenAPI contract present
        run: |
          test -f lumen/api/openapi.yaml
          grep -q "/v1/generate" lumen/api/openapi.yaml

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + testcontainers
        run: |
          python -m pip install -U pip
          pip install pytest testcontainers sqlalchemy psycopg2-binary redis
          pip install -r requirements.txt

      - name: Integration with testcontainers
        env:
          PYTHONPATH: ${{ github.workspace }}
          TBE_TESTCONTAINERS: "1"
          TELEGRAM_BOT_TOKEN: "1:ci-placeholder"
          ENVIRONMENT: development
          TBE_TOKEN_SECRET: "unit-test-secret-key-32b-ci-only!!"
        # Soft-fail only for container infra flakiness — install above is strict
        run: pytest tests/test_live_runner_integration.py -q --tb=short || true
